# 在 Windows runner 上打包 ExamTimeDown 的 MSI / EXE 安装包
# 触发：手动执行（workflow_dispatch）+ 推送 tag v* 时自动触发
#
# 注意：JDK jpackage 不支持交叉打包，必须在 Windows 环境才能产出 Windows 安装包。
# 本 workflow 在 windows-latest runner 上运行，产出 MSI/EXE 并作为 artifact 上传。
name: Build Windows Installer

on:
  # 手动触发：在 GitHub 仓库 Actions 页面点 "Run workflow"
  workflow_dispatch:
  # 推送 v* 开头的 tag 时自动触发（如 v1.0.0）
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build MSI/EXE on Windows
    runs-on: windows-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 WiX Toolset（jpackage 打包 MSI 必需）
      #    jpackage 需要 wix.exe / candle.exe / light.exe 在 PATH 中
      - name: Install WiX Toolset 3.11
        run: |
          choco install wixtoolset -y --version=3.11.2
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      # 3. 配置 JDK 21（与本地开发保持一致，foojay-resolver 也可自动下载）
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. 缓存 Gradle 依赖，加速后续构建
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 5. 编译 + 运行测试（任意一项失败即终止，不会产出残缺的安装包）
      - name: Compile & Test
        shell: bash
        run: ./gradlew :composeApp:jvmTest --no-daemon --console=plain

      # 6. 打包 MSI 与 EXE（jpackage 在 Windows runner 上可正常执行）
      - name: Package MSI & EXE
        shell: bash
        run: ./gradlew :composeApp:packageMsi :composeApp:packageExe --no-daemon --console=plain

      # 7. 上传 MSI 安装包为构建产物（90 天保留期）
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ExamTimeDown-windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 90

      # 8. 上传 EXE 安装包为构建产物
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExamTimeDown-windows-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 90

      # 9. 若是 tag 触发，创建 GitHub Release 并附加 MSI/EXE
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          generate_release_notes: true
