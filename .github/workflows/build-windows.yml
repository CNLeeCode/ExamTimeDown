# 在 Windows runner 上打包 ExamTimeDown 的 EXE 安装包
# 触发：手动执行（workflow_dispatch）+ 推送 tag v* 时自动触发
#
# 注意：JDK jpackage 不支持交叉打包，必须在 Windows 环境才能产出 Windows 安装包。
# 只产出 EXE（jpackage 内置打包器，零外部依赖）；MSI 需要 WiX Toolset，但
# Compose Desktop 自动下载的 WiX 3.11 在 Windows Server 2022 上链接 MSI 时
# 退出码 311，故放弃 MSI。
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build EXE on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 配置 JDK 21（与本地开发保持一致）
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 缓存 Gradle 依赖，加速后续构建
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 编译 + 运行测试
      - name: Compile & Test
        shell: bash
        run: ./gradlew :composeApp:jvmTest --no-daemon --console=plain

      # 打包 EXE（jpackage 内置打包器，不依赖 WiX）
      - name: Package EXE
        shell: bash
        run: ./gradlew :composeApp:packageExe --no-daemon --console=plain

      # 上传 EXE 安装包
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExamTimeDown-windows-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 90

      # 若是 tag 触发，创建 GitHub Release 并附加 EXE
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/exe/*.exe
          generate_release_notes: true
